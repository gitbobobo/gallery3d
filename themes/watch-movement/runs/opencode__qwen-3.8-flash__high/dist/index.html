<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>机械机芯 · 运转透视</title>
    <script type="module" crossorigin src="./assets/index-DBJ9ROOw.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B7kPg_Fv.css">
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>

      <header id="brand">
        <div class="eyebrow">4 Hz · 28’800 A/h · 20T ESCAPE</div>
        <h1>机械机芯<span class="thin"> · 运转透视</span></h1>
      </header>

      <div id="toolbar">
        <div class="group" role="group" aria-label="速度">
          <button class="btn speed" data-speed="0.25">¼×</button>
          <button class="btn speed on" data-speed="0.5">½×</button>
          <button class="btn speed" data-speed="1">1×</button>
        </div>
        <div class="group">
          <button class="btn" id="pause">暂停</button>
          <button class="btn" id="labelsToggle">标注</button>
          <button class="btn" id="reset">复位</button>
        </div>
      </div>

      <div id="hint">拖动旋转 · 滚轮或双指缩放 · 点击零件查看说明</div>

      <div id="labels"></div>
      <div id="tip"></div>

      <aside id="panel" aria-live="polite">
        <button id="p-close" aria-label="关闭">×</button>
        <div class="p-head">
          <h2 id="p-name"></h2>
          <div id="p-en"></div>
        </div>
        <p id="p-desc"></p>
        <div id="p-spec"></div>
      </aside>

      <nav id="chips" aria-label="零件列表"></nav>
    </div>
  </body>
</html>
