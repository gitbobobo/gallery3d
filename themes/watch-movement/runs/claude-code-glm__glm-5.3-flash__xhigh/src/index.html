<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23d9b45c%22/%3E%3C/svg%3E">
<title>机械表机芯 · 3D</title>
<style>
  :root {
    --gold: #d9b45c;
    --gold-dim: #9c8443;
    --ink: #e9e4d6;
    --panel: rgba(16, 15, 13, 0.72);
    --line: rgba(217, 180, 92, 0.28);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(120% 90% at 50% 38%, #2a2620 0%, #17150f 46%, #0b0a07 100%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  #app { position: fixed; inset: 0; touch-action: none; }
  canvas { display: block; }

  .ui { position: fixed; z-index: 10; pointer-events: none; }
  .ui > * { pointer-events: auto; }

  /* 标题 */
  #hdr { top: 16px; left: 18px; }
  #hdr h1 {
    font-family: Georgia, "Songti SC", "STSong", serif;
    font-weight: 500; font-size: 21px; letter-spacing: 4px; color: var(--ink);
  }
  #hdr .en { font-size: 10px; letter-spacing: 3.5px; color: var(--gold-dim); text-transform: uppercase; margin-top: 5px; }
  #hdr .rule { width: 54px; height: 1px; background: linear-gradient(90deg, var(--gold), transparent); margin-top: 9px; }

  /* 控制面板 */
  #ctrl {
    top: 14px; right: 14px; display: flex; align-items: center; gap: 6px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 11px;
    padding: 6px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  #ctrl button, #ctrl .seg button {
    background: transparent; border: none; color: var(--ink); cursor: pointer;
    font-size: 12px; letter-spacing: 0.5px; padding: 6px 9px; border-radius: 7px;
    font-family: inherit; white-space: nowrap;
  }
  #ctrl button:hover { background: rgba(217,180,92,0.14); }
  #ctrl .seg { display: flex; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 2px; }
  #ctrl .seg button.on { background: rgba(217,180,92,0.88); color: #171410; font-weight: 600; }
  #ctrl #btnPause { font-size: 13px; width: 32px; text-align: center; }
  #ctrl .lbl { font-size: 10px; color: var(--gold-dim); padding: 0 2px 0 6px; letter-spacing: 1px; }

  /* 底部提示 */
  #hint {
    bottom: 12px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 2px; color: rgba(233,228,214,0.42);
    white-space: nowrap; transition: opacity 1s;
  }

  /* 零件清单 */
  #chips {
    left: 14px; bottom: 40px; display: flex; flex-direction: column; gap: 5px;
    max-height: 52vh; overflow: hidden;
  }
  #chips .chip {
    background: var(--panel); border: 1px solid rgba(217,180,92,0.16);
    color: rgba(233,228,214,0.78); font-size: 11px; letter-spacing: 1.5px;
    padding: 5px 11px; border-radius: 20px; cursor: pointer; backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px); width: fit-content; transition: all .18s;
  }
  #chips .chip:hover { border-color: var(--gold); color: var(--ink); }
  #chips .chip.on { background: rgba(217,180,92,0.9); color: #171410; border-color: transparent; font-weight: 600; }

  /* 信息卡 */
  #card {
    right: 14px; bottom: 40px; width: 320px;
    background: linear-gradient(160deg, rgba(26,23,18,0.93), rgba(15,14,11,0.93));
    border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px 16px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 18px 50px rgba(0,0,0,0.55);
    opacity: 0; transform: translateY(14px); pointer-events: none !important;
    transition: opacity .28s, transform .28s;
  }
  #card.show { opacity: 1; transform: translateY(0); pointer-events: auto !important; }
  #card .tag { font-size: 9px; letter-spacing: 3px; color: var(--gold-dim); text-transform: uppercase; }
  #card h2 {
    font-family: Georgia, "Songti SC", "STSong", serif; font-weight: 500;
    font-size: 22px; letter-spacing: 2px; color: var(--ink); margin-top: 5px;
  }
  #card .en { font-size: 11px; letter-spacing: 1.5px; color: var(--gold); margin-top: 3px; font-style: italic; }
  #card .desc { font-size: 12.5px; line-height: 1.75; color: rgba(233,228,214,0.82); margin-top: 11px; }
  #card .stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 13px; }
  #card .st {
    font-size: 10.5px; letter-spacing: 0.5px; color: var(--gold);
    background: rgba(217,180,92,0.09); border: 1px solid rgba(217,180,92,0.22);
    padding: 4px 9px; border-radius: 6px;
  }
  #card #cardClose {
    position: absolute; top: 10px; right: 12px; background: none; border: none;
    color: rgba(233,228,214,0.4); font-size: 17px; cursor: pointer; line-height: 1;
  }
  #card #cardClose:hover { color: var(--ink); }

  @media (max-width: 700px) {
    #hdr h1 { font-size: 16px; letter-spacing: 3px; }
    #hdr .en { font-size: 8.5px; letter-spacing: 2.5px; }
    #ctrl { top: 10px; right: 10px; padding: 4px; gap: 4px; }
    #ctrl button, #ctrl .seg button { font-size: 11px; padding: 5px 7px; }
    #chips { left: 10px; bottom: 12px; flex-direction: row; flex-wrap: wrap; max-height: none;
             max-width: calc(100vw - 20px); gap: 4px; }
    #chips .chip { font-size: 10px; padding: 4px 9px; }
    #hint { display: none; }
    #card { left: 10px; right: 10px; bottom: 58px; width: auto; padding: 15px 17px 13px; }
    #card h2 { font-size: 18px; }
    #card .desc { font-size: 12px; line-height: 1.65; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div class="ui" id="hdr">
  <h1>机械表机芯</h1>
  <div class="en">Mechanical Movement · 18 000 vph</div>
  <div class="rule"></div>
</div>

<div class="ui" id="ctrl">
  <button id="btnPause" title="暂停 / 继续">⏸</button>
  <span class="lbl">速度</span>
  <div class="seg" id="speedSeg">
    <button data-s="0.25">¼×</button>
    <button data-s="1" class="on">1×</button>
    <button data-s="4">4×</button>
  </div>
  <button id="btnBridge" title="显示/隐藏夹板">隐藏夹板</button>
</div>

<div class="ui" id="chips"></div>

<div class="ui" id="card">
  <button id="cardClose">✕</button>
  <div class="tag">零件 · Component</div>
  <h2 id="cardName">—</h2>
  <div class="en" id="cardEn">—</div>
  <div class="desc" id="cardDesc"></div>
  <div class="stats" id="cardStats"></div>
</div>

<div class="ui" id="hint">拖动旋转 · 滚轮缩放 · 点击零件查看说明</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
