<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>机械机芯 · Mechanical Movement</title>
  <style>
    :root {
      --bg-0: #06080d;
      --bg-1: #0d1218;
      --gold: #d8b065;
      --gold-soft: #f0d9a3;
      --steel: #d8dce2;
      --ruby: #d2324a;
      --text: #f4f0e6;
      --text-dim: #9aa3b0;
      --panel: rgba(14, 18, 26, 0.88);
      --panel-border: rgba(216, 176, 101, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 40%, #1a2230 0%, #06080d 70%);
      color: var(--text);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    #app { position: fixed; inset: 0; }

    canvas#scene {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    canvas#scene:active { cursor: grabbing; }

    /* HUD */
    .hud {
      position: fixed;
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }

    .hud-title {
      top: max(18px, env(safe-area-inset-top, 0px) + 14px);
      left: 0;
      right: 0;
      text-align: center;
    }
    .hud-title .zh {
      font-size: clamp(15px, 2.6vw, 20px);
      letter-spacing: 0.32em;
      color: var(--gold-soft);
      font-weight: 300;
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    }
    .hud-title .en {
      margin-top: 4px;
      font-size: clamp(9px, 1.4vw, 11px);
      letter-spacing: 0.42em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .hud-hint {
      bottom: max(18px, env(safe-area-inset-bottom, 0px) + 14px);
      left: 0;
      right: 0;
      text-align: center;
      font-size: clamp(11px, 1.7vw, 13px);
      color: var(--text-dim);
      letter-spacing: 0.18em;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .hud-hint .dot {
      display: inline-block;
      margin: 0 0.6em;
      color: var(--gold);
      opacity: 0.6;
    }

    .hud-corner {
      bottom: max(18px, env(safe-area-inset-bottom, 0px) + 14px);
      right: 16px;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      opacity: 0.7;
      font-variant-numeric: tabular-nums;
    }

    /* Info panel */
    #info {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, calc(-50% - 10px)) scale(0.96);
      width: min(420px, calc(100vw - 36px));
      max-height: calc(100vh - 80px);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      padding: 22px 24px 24px;
      color: var(--text);
      box-shadow: 0 24px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
      opacity: 0;
      pointer-events: none;
      transition: opacity 240ms ease, transform 280ms cubic-bezier(0.22, 0.61, 0.36, 1);
      z-index: 20;
      overflow-y: auto;
    }
    #info.show {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    #info .close {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 30px;
      height: 30px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      border-radius: 50%;
      transition: background 160ms ease, color 160ms ease;
    }
    #info .close:hover { color: var(--gold-soft); background: rgba(255,255,255,0.06); }

    #info .tag {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.3em;
      color: var(--gold);
      padding: 3px 8px;
      border: 1px solid rgba(216, 176, 101, 0.4);
      border-radius: 4px;
      margin-bottom: 12px;
    }
    #info h2 {
      font-size: 22px;
      font-weight: 500;
      color: var(--gold-soft);
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
    #info h3 {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-dim);
      letter-spacing: 0.18em;
      margin-bottom: 16px;
      text-transform: uppercase;
    }
    #info p { font-size: 14px; line-height: 1.7; color: #d8d2c2; }
    #info .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 14px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    #info .stats .k { font-size: 10px; letter-spacing: 0.18em; color: var(--text-dim); text-transform: uppercase; }
    #info .stats .v { font-size: 13px; color: var(--gold-soft); margin-top: 2px; font-variant-numeric: tabular-nums; }

    /* Loader */
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: radial-gradient(ellipse at 50% 40%, #1a2230 0%, #06080d 70%);
      color: var(--text-dim);
      font-size: 12px;
      letter-spacing: 0.3em;
      z-index: 30;
      transition: opacity 600ms ease;
    }
    #loader.gone { opacity: 0; pointer-events: none; }
    #loader .ring {
      width: 44px; height: 44px;
      border: 1.5px solid rgba(216,176,101,0.15);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 1.1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Mobile tweaks */
    @media (max-width: 520px) {
      #info { padding: 20px 20px 22px; }
      #info h2 { font-size: 19px; }
      #info p { font-size: 13.5px; }
      #info .stats { grid-template-columns: 1fr; gap: 8px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <div class="hud hud-title">
      <div class="zh">机 · 芯 · 演 · 示</div>
      <div class="en">Mechanical Calibre · Live</div>
    </div>
    <div class="hud hud-hint">
      <span>拖动旋转</span><span class="dot">·</span>
      <span>滚轮缩放</span><span class="dot">·</span>
      <span>点击零件</span>
    </div>
    <div class="hud hud-corner" id="rpm">— bph</div>

    <div id="info" role="dialog" aria-modal="true">
      <button class="close" aria-label="关闭">×</button>
      <div class="tag" id="info-tag">PART</div>
      <h2 id="info-name">—</h2>
      <h3 id="info-en">—</h3>
      <p id="info-desc">—</p>
      <div class="stats" id="info-stats"></div>
    </div>

    <div id="loader">
      <div class="ring"></div>
      <div>LOADING MOVEMENT</div>
    </div>
  </div>

  <script src="./three.min.js"></script>
  <script src="./OrbitControls.js"></script>
  <script src="./main.js"></script>
</body>
</html>
