<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>池塘一角</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="scene" aria-label="池塘三维场景，可拖动旋转、滚轮缩放，点按水面互动"></canvas>

    <aside class="colophon" aria-live="polite">
      <h1>池塘一角</h1>
      <p id="mood">微风　晴　白昼</p>
      <span class="seal" aria-hidden="true">池</span>
    </aside>

    <p class="hint" id="hint">点按水面，激起一圈涟漪</p>

    <nav class="panel" aria-label="控制">
      <div class="group tools" role="radiogroup" aria-label="点按水面时">
        <button type="button" role="radio" data-tool="ripple" aria-checked="true" title="涟漪（1）">
          <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="14" rx="3" ry="1.4" /><ellipse cx="12" cy="14" rx="7" ry="3.2" /><ellipse cx="12" cy="14" rx="10.5" ry="5" opacity=".5" /></svg>
          <span>涟漪</span>
        </button>
        <button type="button" role="radio" data-tool="stone" aria-checked="false" title="石子（2）">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 14.5c0-3.6 3-6.5 7-6.5 3.4 0 6 2.2 6 5.2 0 2.9-2.7 4.8-6.6 4.8-3.6 0-6.4-1.3-6.4-3.5z" /><path d="M9 11.5c1-.9 2.2-1.3 3.4-1.3" opacity=".6" /></svg>
          <span>石子</span>
        </button>
        <button type="button" role="radio" data-tool="boat" aria-checked="false" title="纸船（3）">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h18l-3.2 4.5H6.2z" /><path d="M8 13l4-8 4 8" /><path d="M2 20c2 0 2-1 4-1s2 1 4 1 2-1 4-1 2 1 4 1 2-1 4-1" opacity=".5" /></svg>
          <span>纸船</span>
        </button>
        <button type="button" role="radio" data-tool="food" aria-checked="false" title="鱼食（4）">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="10" r="1.6" /><circle cx="13.5" cy="7.5" r="1.6" /><circle cx="15" cy="13" r="1.6" /><circle cx="10" cy="15.5" r="1.6" /><path d="M3 19.5c3 1.3 15 1.3 18 0" opacity=".5" /></svg>
          <span>鱼食</span>
        </button>
      </div>

      <div class="group env">
        <label class="wind" title="风力（[ 和 ] 调节）">
          <span class="wind-label">风</span>
          <input id="wind" type="range" min="0" max="100" value="30" aria-label="风力" />
        </label>
        <button type="button" class="rain" id="rain" aria-pressed="false" title="下雨（R）">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 15.5a4 4 0 0 1 .4-8 5.5 5.5 0 0 1 10.3 1.6A3.3 3.3 0 0 1 17 15.5z" /><path d="M8.5 18.5l-1 2M12.5 18.5l-1 2M16.5 18.5l-1 2" /></svg>
          <span>雨</span>
        </button>
        <div class="time" role="radiogroup" aria-label="时间" title="时间（T 切换）">
          <button type="button" role="radio" data-time="0" aria-checked="true">白天</button>
          <button type="button" role="radio" data-time="1" aria-checked="false">黄昏</button>
          <button type="button" role="radio" data-time="2" aria-checked="false">夜晚</button>
        </div>
      </div>
    </nav>

    <div class="fallback">这个页面需要支持 WebGL 2 的浏览器。</div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
