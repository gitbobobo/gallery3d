<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>溪山行旅图 · 范宽</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #14100c; overflow: hidden;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  #stage { position: absolute; inset: 0; }
  canvas { display: block; }
  #cap {
    position: absolute; left: 50%; bottom: 4.5%;
    transform: translateX(-50%);
    padding: 0.45em 1.2em;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "DFKai-SB", "BiauKai", serif;
    font-size: clamp(15px, 3.4vmin, 24px);
    letter-spacing: 0.35em; text-indent: 0.35em;
    color: #2e2620;
    background: rgba(226, 212, 182, 0.62);
    border-radius: 3px;
    box-shadow: 0 1px 14px rgba(20, 14, 8, 0.25);
    opacity: 0; transition: opacity 1.1s ease;
    white-space: nowrap; pointer-events: none;
    max-width: 92vw; overflow: hidden; text-overflow: ellipsis;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="cap"></div>
</div>
<script src="main.js"></script>
</body>
</html>
