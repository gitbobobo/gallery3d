<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>溪山行旅图 · 一卷四幕</title>
<style>
  :root { --ink:#27312d; --paper:#e9dfc8; --red:#9d402d; }
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#242a28; }
  body { display:grid; place-items:center; font-family:"Songti SC","Noto Serif SC",STSong,serif; color:var(--ink); }
  .frame { position:relative; width:min(100vw, 61vh); height:min(100vh, 165vw); aspect-ratio: 2 / 3; max-height:100vh; max-width:100vw; overflow:hidden; background:#e9dfc8; box-shadow:0 0 0 1px rgba(233,223,200,.18),0 24px 80px rgba(0,0,0,.45); }
  canvas { width:100%; height:100%; display:block; touch-action:none; }
  .topline { position:absolute; top:clamp(14px,3.3vw,30px); left:clamp(16px,4vw,42px); right:clamp(16px,4vw,42px); display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; mix-blend-mode:multiply; }
  .eyebrow { font-size:clamp(10px,1.5vw,14px); letter-spacing:.32em; writing-mode:vertical-rl; opacity:.65; }
  .seal { width:clamp(22px,5vw,38px); height:clamp(22px,5vw,38px); border:1px solid rgba(157,64,45,.78); color:rgba(157,64,45,.9); display:grid; place-items:center; font-size:clamp(10px,1.7vw,14px); line-height:1.05; writing-mode:vertical-rl; letter-spacing:.05em; }
  .caption { position:absolute; left:clamp(16px,4vw,42px); right:clamp(16px,4vw,42px); bottom:clamp(16px,4vw,42px); display:flex; justify-content:space-between; align-items:end; pointer-events:none; mix-blend-mode:multiply; padding:10px 12px 8px; margin:-10px -12px -8px; background:linear-gradient(90deg,rgba(233,223,200,.68),rgba(233,223,200,.22) 72%,transparent); }
  .caption-copy { max-width:70%; }
  .act { font-size:clamp(11px,1.65vw,15px); letter-spacing:.28em; margin-bottom:.45em; opacity:.68; }
  .line { font-size:clamp(15px,2.7vw,23px); letter-spacing:.15em; line-height:1.6; }
  .hint { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:clamp(8px,1.3vw,11px); letter-spacing:.12em; opacity:.52; writing-mode:vertical-rl; }
  @media (max-width:460px) { .frame{ width:100vw; height:100vh; aspect-ratio:auto; } .caption-copy{max-width:80%;} }
  @media (prefers-reduced-motion:reduce) { .hint::after{content:" · 静帧";} }
</style>
</head>
<body>
<main class="frame" aria-label="范宽《溪山行旅图》的代码水墨动画">
  <canvas id="ink" aria-hidden="true"></canvas>
  <div class="topline"><div class="eyebrow">溪山行旅图 · 范宽意</div><div class="seal">行旅</div></div>
  <div class="caption"><div class="caption-copy"><div id="act" class="act">壹 · 晨雾</div><div id="line" class="line">雾从溪谷起，山在天光里醒来。</div></div><div class="hint">自动循环　触摸可暂停</div></div>
</main>
<script>
(() => {
  const c = document.getElementById('ink'), ctx = c.getContext('2d');
  const actEl = document.getElementById('act'), lineEl = document.getElementById('line');
  const W = 900, H = 1350, DPR = Math.min(2, devicePixelRatio || 1);
  let raf, paused = false, start = performance.now(), last = start;
  const acts = [
    ['壹 · 晨雾','雾从溪谷起，山在天光里醒来。'],
    ['贰 · 行旅','驮铃从林外来，四头骡子沿溪向左。'],
    ['叁 · 钟声','一声钟过千峰，最后的人回望片刻。'],
    ['肆 · 入山','人入山深处，旧画又归于寂静。']
  ];
  function resize(){ const r=c.getBoundingClientRect(); c.width=Math.round(r.width*DPR); c.height=Math.round(r.height*DPR); ctx.setTransform(c.width/W,0,0,c.height/H,0,0); }
  new ResizeObserver(resize).observe(c); resize();
  const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
  const lerp=(a,b,t)=>a+(b-a)*t;
  function noise(x,y){ const s=Math.sin(x*12.9898+y*78.233)*43758.5453; return s-Math.floor(s); }
  function path(points){ ctx.beginPath(); ctx.moveTo(points[0][0],points[0][1]); for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]); }
  function stroke(points, color, width=2, alpha=1){ ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineCap='round'; ctx.lineJoin='round'; path(points); ctx.stroke(); ctx.restore(); }
  function fill(points, color, alpha=1){ ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;path(points);ctx.closePath();ctx.fill();ctx.restore(); }
  function paper(){
    ctx.fillStyle='#e9dfc8';ctx.fillRect(0,0,W,H);
    for(let i=0;i<8200;i++){ let x=noise(i,2)*W,y=noise(i,7)*H,a=.018+noise(i,11)*.035; ctx.fillStyle=`rgba(91,73,52,${a})`;ctx.fillRect(x,y,noise(i,13)*2+.2,noise(i,17)*2+.2); }
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(255,250,230,.14)');g.addColorStop(.54,'rgba(125,107,80,.035)');g.addColorStop(1,'rgba(90,72,49,.13)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  function mountain(){
    // distant wash
    fill([[0,780],[0,640],[80,590],[145,550],[220,570],[290,530],[365,565],[430,515],[500,550],[575,500],[660,540],[735,500],[820,570],[900,540],[900,820]],'#69716b',.15);
    // main cliff silhouette
    const ridge=[[80,725],[95,600],[140,520],[160,430],[205,340],[248,280],[286,185],[330,125],[370,180],[415,96],[455,138],[490,72],[530,110],[565,185],[603,245],[635,300],[676,345],[720,430],[760,490],[820,560],[900,630],[900,920],[0,920],[0,800]];
    fill(ridge,'#303934',.92);
    // lit planes
    fill([[300,150],[360,104],[407,148],[438,100],[472,136],[435,310],[380,400],[300,450],[250,350]],'#535b53',.72);
    fill([[470,105],[520,124],[567,190],[625,300],[684,366],[625,390],[565,320],[520,250]],'#1f2926',.62);
    fill([[165,430],[230,310],[300,250],[270,470],[195,580],[120,630]],'#697067',.5);
    fill([[575,490],[653,402],[737,490],[815,590],[770,690],[660,640]],'#1c2523',.56);
    // mountain texture: dry-brush strokes
    for(let i=0;i<420;i++){
      let y=135+noise(i,23)*600, x=220+noise(i,31)*(650-(y-135)*.34), sl=12+noise(i,41)*40;
      let col=noise(i,51)>.62?'#131d1b':'#879087';
      stroke([[x,y],[x+sl,y-8-noise(i,61)*22],[x+sl*1.4,y+noise(i,71)*8]],col,.7+noise(i,81)*2.2,.13+noise(i,91)*.24);
    }
    // angular cun brush contours
    for(let i=0;i<54;i++){
      const x=205+noise(i,9)*550, y=210+noise(i,19)*490;
      stroke([[x,y],[x+24+noise(i,4)*26,y-18],[x+41+noise(i,3)*26,y-43]], '#111b19', 1.1, .22);
    }
    // waterfall under the right cleft
    const wx=690; stroke([[wx,330],[wx-5,395],[wx+3,460],[wx-2,536],[wx+7,615],[wx+4,695]],'#d9ded2',7,.62); stroke([[wx+9,346],[wx+1,430],[wx+13,515],[wx+8,605],[wx+14,700]],'#f1ead8',2,.72);
    stroke([[wx-13,350],[wx-10,428],[wx-20,520],[wx-8,602],[wx-17,704]],'#8b968b',2,.58);
  }
  function cloud(t){
    const p=clamp(t); ctx.save(); ctx.globalCompositeOperation='screen';
    for(let i=0;i<20;i++){ let y=455+i*17+Math.sin(t*2+i)*9, x=(i*73+ t*90)%1100-100; ctx.fillStyle=`rgba(232,230,211,${.025+.02*Math.sin(i)})`;ctx.beginPath();ctx.ellipse(x,y,170+noise(i,3)*80,27+noise(i,5)*22,0,0,Math.PI*2);ctx.fill(); }
    ctx.restore();
    ctx.save();ctx.globalAlpha=.24*p;ctx.fillStyle='#ebe6d4';ctx.fillRect(0,630,W,240);ctx.restore();
  }
  function foreground(){
    // foot hills + stream
    fill([[0,860],[120,820],[245,840],[334,800],[440,835],[550,805],[670,845],[770,808],[900,840],[900,H],[0,H]],'#26312d',.96);
    fill([[0,1000],[140,950],[245,985],[350,930],[464,1010],[590,955],[700,1020],[820,970],[900,1000],[900,1110],[0,1110]],'#879087',.45);
    // stream
    fill([[0,1064],[120,1038],[245,1057],[370,1030],[510,1060],[625,1045],[760,1085],[900,1065],[900,1155],[770,1139],[620,1140],[500,1118],[350,1130],[220,1109],[0,1140]],'#b7b9a9',.5);
    for(let i=0;i<19;i++){ let y=1063+i*4+noise(i,22)*22; stroke([[25+noise(i,4)*190,y],[220+noise(i,7)*240,y-3],[470+noise(i,8)*250,y+4],[720+noise(i,9)*170,y-2]],'#e4dfc9',1.2,.32); }
    // road
    stroke([[845,1115],[740,1084],[645,1080],[548,1061],[470,1040],[360,1000],[260,958],[180,928]],'#d6cdb4',14,.32);
    stroke([[842,1119],[740,1088],[645,1081],[545,1065],[465,1044],[358,1004],[258,961],[180,930]],'#514f46',2,.45);
    // foreground rocks
    fill([[0,1100],[60,1056],[132,1046],[205,1084],[242,1160],[210,1240],[95,1274],[0,1260]],'#1e2926',1);
    fill([[0,1110],[59,1073],[115,1070],[165,1095],[130,1150],[44,1170],[0,1160]],'#515a52',.75);
    for(let i=0;i<50;i++){ let x=noise(i,16)*215,y=1070+noise(i,17)*195; stroke([[x,y],[x+22+noise(i,8)*30,y-13],[x+39+noise(i,9)*25,y-33]],'#b2b0a0',.65,.16); }
    // right trees
    for(let i=0;i<26;i++){ let x=740+noise(i,12)*160,y=735+noise(i,13)*310; stroke([[x,y+70],[x-5,y],[x+noise(i,4)*20-10,y-50]],'#1b2925',2.2,.65); for(let j=0;j<4;j++){ stroke([[x,y-12-j*12],[x-20-noise(i,j)*15,y-22-j*11]],'#27332e',1.2,.38); } }
    // monastery nestled left-middle
    fill([[188,795],[235,775],[282,795],[282,831],[188,831]],'#3d4740',.85); fill([[178,793],[236,760],[294,793]],'#232d29',.95); stroke([[200,777],[200,830]],'#c6bea8',1,.3); stroke([[245,775],[245,830]],'#c6bea8',1,.3);
  }
  function caravan(t, alpha=1){
    // t from 0..1, right to left
    const x=860- t*675, y=1007- t*45;
    ctx.save();ctx.globalAlpha=alpha;
    // people and pack mules, spaced along road
    for(let i=0;i<4;i++){
      const px=x+i*53, py=y+i*2;
      ctx.fillStyle='#303b35';ctx.beginPath();ctx.ellipse(px,py-16,23,14,0,0,Math.PI*2);ctx.fill();
      stroke([[px-15,py-15],[px-21,py+19],[px-12,py+28]],'#202b27',3,.95); stroke([[px+13,py-14],[px+18,py+21],[px+28,py+26]],'#202b27',3,.95);
      ctx.fillStyle='#b49768';ctx.beginPath();ctx.ellipse(px,py-32,6,7,0,0,Math.PI*2);ctx.fill();
      stroke([[px-19,py-19],[px+18,py-18]],'#bda775',3,.9);
    }
    const riderX=x-36; ctx.fillStyle='#333e38';ctx.beginPath();ctx.ellipse(riderX,y-38,5,6,0,0,Math.PI*2);ctx.fill();stroke([[riderX,y-32],[riderX-1,y-2],[riderX-7,y+9]],'#27332e',2.5,.95);stroke([[riderX,y-3],[riderX+11,y+7]],'#27332e',2,.95);
    ctx.restore();
  }
  function birds(t){ const a=clamp(t); for(let i=0;i<8;i++){ let x=470 + i*34 + (t*90)%130, y=742-i*7-Math.sin(t*8+i)*16; stroke([[x,y],[x+7,y-5],[x+14,y]],'#27332e',1.5,.65*a); } }
  function signature(alpha){ ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle='#973f2e';ctx.font='34px "Songti SC",serif';ctx.fillText('范宽',790,1250);ctx.strokeStyle='#973f2e';ctx.lineWidth=2;ctx.strokeRect(784,1217,72,48);ctx.restore(); }
  function draw(now){
    const stamp=Number.isFinite(now)?now:performance.now();
    const elapsed=(stamp-start)/1000, cycle=28, tt=((elapsed%cycle)+cycle)%cycle/cycle;
    const idx=Math.max(0,Math.min(3,Math.floor(tt*4)||0)), local=(tt*4)%1, copy=acts[idx]||acts[0];
    actEl.textContent=copy[0]; lineEl.textContent=copy[1];
    paper(); mountain();
    // fog opens in act one, returns in final act
    let fog=idx===0?1-clamp(local/.9):idx===3?clamp((local-.46)/.54):0;
    cloud(fog);
    foreground();
    if(idx===1){ caravan(clamp(local/.78)); }
    if(idx===2){ caravan(1); birds(clamp((local-.08)/.42)); }
    if(idx===3){ caravan(1-clamp((local-.02)/.62)); signature(clamp((local-.72)/.22)); }
    // ink edge and subtle vignette
    ctx.save();ctx.strokeStyle='rgba(55,49,39,.45)';ctx.lineWidth=2;ctx.strokeRect(13,13,W-26,H-26);let v=ctx.createRadialGradient(450,680,430,450,680,800);v.addColorStop(0,'rgba(20,30,27,0)');v.addColorStop(1,'rgba(20,30,27,.16)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);ctx.restore();
    if(!paused) raf=requestAnimationFrame(draw);
  }
  function toggle(){ paused=!paused; if(paused){ cancelAnimationFrame(raf); } else { start=performance.now()-((performance.now()-start)%28000); raf=requestAnimationFrame(draw); } }
  c.addEventListener('click',toggle); c.addEventListener('touchend',e=>{e.preventDefault();toggle()},{passive:false});
  raf=requestAnimationFrame(draw);
})();
</script>
</body>
</html>
