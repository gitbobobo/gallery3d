<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>溪山行旅 · 水墨</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#150f07;
    font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(130% 95% at 50% 42%,#261c0f 0%,#170f07 72%,#0c0804 100%);}
  #scroll{position:relative;box-shadow:0 0 90px rgba(0,0,0,.85),0 0 22px rgba(0,0,0,.6);}
  #cv{display:block;width:100%;height:100%;}

  /* 裱边题签（宽屏才可见，由 JS 定位） */
  #title{position:fixed;top:8%;writing-mode:vertical-rl;
    color:#8a744f;font-size:clamp(13px,2vh,19px);letter-spacing:.55em;opacity:0;
    text-shadow:0 1px 0 rgba(0,0,0,.5);pointer-events:none;transition:opacity .6s;}
  #title small{display:block;margin-top:1.2em;font-size:.72em;opacity:.7;letter-spacing:.4em;}

  /* 竖排字幕（画内左侧留云处） */
  #caps{position:absolute;top:6%;left:5%;height:58%;writing-mode:vertical-rl;
    color:#241c11;pointer-events:none;user-select:none;}
  #caps .box{position:absolute;top:0;right:0;opacity:0;transition:opacity 2.2s ease;}
  #caps .box.on{opacity:1;}
  #caps .act{font-size:clamp(9px,1.6vh,14px);letter-spacing:.55em;color:#81301f;opacity:.92;
    margin:0 0 1.4em;padding-top:.2em;}
  #caps .ln{font-size:clamp(12px,2.3vh,21px);letter-spacing:.38em;line-height:1;font-weight:600;
    margin:0 0 .5em;text-shadow:0 0 1px rgba(36,28,17,.35);}
  #caps .ln + .ln{margin-top:.9em;}
</style>
</head>
<body>
<div id="stage">
  <div id="scroll">
    <canvas id="cv" aria-label="水墨动画《溪山行旅》"></canvas>
    <div id="caps"></div>
  </div>
</div>
<div id="title">范寬谿山行旅圖<small>北宋 · 絹本水墨</small></div>
<script src="ink.js"></script>
<script src="scene.js"></script>
<script src="story.js"></script>
</body>
</html>
